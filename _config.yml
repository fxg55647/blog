title: "First Principles Blues"
description: "Ajatuksia rakentamisesta, tekoälyagenteista ja turvallisesta automaatiosta."
author: Leima
url: "https://fxg55647.github.io"
baseurl: "/blog"

remote_theme: daattali/beautiful-jekyll@6.0.1
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

language: fi
timezone: Europe/Helsinki
navbar-links:
  Etusivu: ""
  Tietoa: "about"
  English: "en"
title-on-all-pages: true
date_format: "%-d.%-m.%Y"
excerpt_length: 55
feed_show_excerpt: true
feed_show_tags: false
post_search: true
edit_page_button: false
page-col: "#FFFCF5"
text-col: "#29362E"
link-col: "#286044"
hover-col: "#194B33"
navbar-col: "#F4EEDC"
navbar-text-col: "#29362E"
navbar-border-col: "#DED5BC"
footer-col: "#F4EEDC"
footer-text-col: "#56634F"
footer-link-col: "#286044"
footer-hover-col: "#194B33"
social-network-links:
  rss: true
site-css:
  - /assets/css/blog.css

# Google Search Console -vahvistus (head-language.html tuottaa meta-tagin)
webmaster_verifications:
  google: b9hj9Q5y55lpjbNwtY_U2g5OTh88c5tMfY-NMwk1kvk

markdown: kramdown
permalink: /:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - README.md
  - CLAUDE.md

# Kieliversiot: suomi on oletus (_posts/), englanti en/_posts/-kansiossa.
# Saman postauksen kieliversiot yhdistetään yhteisellä `ref`-arvolla.
defaults:
  - scope:
      path: ""
    values:
      lang: fi
      locale: fi_FI
      language: fi
      head-extra:
        - head-language.html
  - scope:
      path: ""
      type: posts
    values:
      layout: post-lang
      lang: fi
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
      language: en
  - scope:
      path: "en"
      type: posts
    values:
      lang: en
      locale: en_US
      language: en
      permalink: /en/:year/:month/:day/:title/

feed:
  categories:
    - en
