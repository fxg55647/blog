title: "Leiman blogi"
description: "Ajatuksia rakentamisesta, tekoälyagenteista ja turvallisesta automaatiosta."
author: Leima
url: "https://fxg55647.github.io"
baseurl: "/blog"

theme: minima
plugins:
  - jekyll-feed

minima:
  skin: dark

show_excerpts: true

header_pages:
  - about.md
  - en/index.md

markdown: kramdown
permalink: /:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - README.md

# Kieliversiot: suomi on oletus (_posts/), englanti en/_posts/-kansiossa.
# Saman postauksen kieliversiot yhdistetään yhteisellä `ref`-arvolla.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post-lang
      lang: fi
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "en"
      type: posts
    values:
      lang: en
      permalink: /en/:year/:month/:day/:title/

feed:
  categories:
    - en
